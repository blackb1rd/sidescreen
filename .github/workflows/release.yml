name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      # Optional: without these the app is ad-hoc signed and not notarized.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install ninja

      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build Spanly.app
        run: |
          export SPANLY_VERSION="${GITHUB_REF_NAME#v}"
          export SPANLY_SIGN_IDENTITY="$MACOS_SIGN_IDENTITY"
          scripts/build-mac.sh

      - name: Notarize
        if: env.NOTARY_KEY_P8 != '' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          echo "$NOTARY_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit dist/Spanly-mac.zip --wait \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          xcrun stapler staple dist/Spanly.app
          (cd dist && rm Spanly-mac.zip && ditto -c -k --keepParent Spanly.app Spanly-mac.zip)
          rm "$RUNNER_TEMP/notary.p8"

      - uses: actions/upload-artifact@v5
        with:
          name: Spanly-mac.zip
          path: dist/Spanly-mac.zip

  # Windows and Linux (beta).
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: spanly-linux-x86_64.tar.gz
          - os: windows-latest
            archive: spanly-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer and GLib
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --target spanly --parallel
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/spanly
          strip build/spanly
          cp build/spanly README.md LICENSE packaging/linux/70-spanly.rules dist/spanly/
          tar -C dist -czf ${{ matrix.archive }} spanly
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/spanly | Out-Null
          Copy-Item build/Release/spanly.exe, README.md, LICENSE dist/spanly/
          Compress-Archive -Path dist/spanly -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish:
    needs: [mac, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" Spanly-mac.zip spanly-* --generate-notes
