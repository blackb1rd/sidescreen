name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

jobs:
  # Build and test on each OS (Mac, Windows, Linux), and the microphone driver on the Mac.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Ninja (Mac)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install GStreamer, GLib and Ninja (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - name: Build and test (Mac, Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --preset release
          cmake --build --preset release --parallel
          ctest --preset release
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --preset windows
          cmake --build --preset windows --parallel
          ctest --preset windows
      - name: Build the microphone driver (Mac)
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++23 -bundle -Wall -Wextra -Werror -Wno-unused-parameter -arch arm64 -arch x86_64 \
            -framework CoreAudio -framework CoreFoundation src/driver/*.cpp -o /tmp/SpanlyMicrophone

  # clang-format and clang-tidy (pinned versions, so results match on every machine).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools and libraries
        run: |
          pip install clang-format==23.1.1 clang-tidy==22.1.8
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp')
      - name: Build with clang (for compile_commands.json)
        run: cmake --preset tidy && cmake --build --preset tidy --parallel
      - name: clang-tidy (the code built on Linux)
        run: |
          clang-tidy -p build/tidy --quiet $(git ls-files 'src/core/*.cpp' 'src/app/*.cpp' 'src/platform/common/*.cpp' \
            'src/platform/linux/*.cpp' 'src/platform/posix/*.cpp' 'tests/*.cpp') 2>&1 | tee tidy.log
          ! grep -E "(warning|error):" tidy.log

  # The C++ core under AddressSanitizer and UBSan.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
      - run: cmake --preset asan && cmake --build --preset asan --parallel && ctest --preset asan

  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No source file over 500 lines
        run: |
          long=$(find src tests scripts -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.sh' -o -name '*.py' \) \
                 -exec awk 'END { if (NR > 500) print FILENAME ": " NR " lines" }' {} \;)
          if [ -n "$long" ]; then echo "$long"; exit 1; fi
