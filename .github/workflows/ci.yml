name: CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:

jobs:
  # Build and test on each OS (Mac, Windows, Linux), and the microphone driver on the Mac.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install GStreamer and GLib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Build the microphone driver (Mac)
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++23 -bundle -Wall -Wextra -Werror -Wno-unused-parameter -arch arm64 -arch x86_64 \
            -framework CoreAudio -framework CoreFoundation src/driver/*.cpp -o /tmp/SpanlyMicrophone

  # clang-format and clang-tidy (pinned versions, so results match on every machine).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools and libraries
        run: |
          pip install clang-format==23.1.1 clang-tidy==22.1.8
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp')
      - name: Configure (for compile_commands.json)
        run: CC=clang CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build --parallel
      - name: clang-tidy (the code built on Linux)
        run: |
          clang-tidy -p build --quiet $(git ls-files 'src/core/*.cpp' 'src/app/*.cpp' 'src/platform/common/*.cpp' \
            'src/platform/linux/*.cpp' 'src/platform/posix/*.cpp' 'tests/*.cpp') 2>&1 | tee tidy.log
          ! grep -E "(warning|error):" tidy.log

  # The C++ core under AddressSanitizer and UBSan.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: CC=clang CXX=clang++ cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DSPANLY_SANITIZE=ON
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No source file over 500 lines
        run: |
          long=$(find src tests scripts -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.sh' -o -name '*.py' \) \
                 -exec awk 'END { if (NR > 500) print FILENAME ": " NR " lines" }' {} \;)
          if [ -n "$long" ]; then echo "$long"; exit 1; fi
