name: CI

on:
  push:
    branches: [main]
  pull_request:

# sccache keeps compiled objects in the GitHub Actions cache (not used on Windows: see CMakeLists.txt).
env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Build and test on each OS (Mac, Windows, Linux), and the microphone driver on the Mac.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest # CMake 4.4 (presets format 12) and Ninja
        with:
          cmakeVersion: "~4.4.0"
      - uses: mozilla-actions/sccache-action@v0.0.11
        if: runner.os != 'Windows'
      - name: Install GStreamer and GLib (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - name: Configure, build, test and package
        shell: bash
        run: |
          os=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          cmake --workflow "$os-release"
      - name: Build the microphone driver (Mac)
        if: runner.os == 'macOS'
        run: |
          clang++ -std=c++23 -bundle -Wall -Wextra -Werror -Wno-unused-parameter -arch arm64 -arch x86_64 \
            -framework CoreAudio -framework CoreFoundation src/driver/*.cpp -o /tmp/SpanlyMicrophone

  # clang-format and clang-tidy (pinned versions, so results match on every machine).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest # CMake 4.4 (presets format 12) and Ninja
        with:
          cmakeVersion: "~4.4.0"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Install tools and libraries
        run: |
          pip install clang-format==23.1.1 clang-tidy==22.1.8
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libglib2.0-dev
      - name: clang-format
        run: clang-format --dry-run --Werror $(git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp' 'fuzz/*.cpp' 'fuzz/*.hpp')
      - name: Build with clang (for compile_commands.json)
        run: cmake --preset linux-tidy && cmake --build --preset linux-tidy --parallel
      - name: clang-tidy (the code built on Linux)
        run: |
          clang-tidy -p build/linux-tidy --quiet $(git ls-files 'src/core/*.cpp' 'src/app/*.cpp' 'src/platform/common/*.cpp' \
            'src/platform/linux/*.cpp' 'src/platform/posix/*.cpp' 'tests/*.cpp') 2>&1 | tee tidy.log
          ! grep -E "(warning|error):" tidy.log

  # The tests under AddressSanitizer and UBSan.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest # CMake 4.4 (presets format 12) and Ninja
        with:
          cmakeVersion: "~4.4.0"
      - uses: mozilla-actions/sccache-action@v0.0.11
      # Newer kernels randomise mmap more than the sanitizers' fixed memory layout allows.
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --workflow linux-asan

  # The tests (including real TCP links with their reader and writer threads) under ThreadSanitizer.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest # CMake 4.4 (presets format 12) and Ninja
        with:
          cmakeVersion: "~4.4.0"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: cmake --workflow linux-tsan

  # libFuzzer on everything that parses bytes from other devices, 30 s per fuzzer. The corpus it
  # grows is kept between runs, so each run starts where the last one stopped.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lukka/get-cmake@latest # CMake 4.4 (presets format 12) and Ninja
        with:
          cmakeVersion: "~4.4.0"
      - uses: mozilla-actions/sccache-action@v0.0.11
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - uses: actions/cache@v4
        with:
          path: build/linux-fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: cmake --workflow linux-fuzz
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: fuzz-crashes
          path: build/linux-fuzz/fuzz-crashes

  file-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No source file over 500 lines
        run: |
          long=$(find src tests fuzz scripts -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.sh' -o -name '*.py' \) \
                 -exec awk 'END { if (NR > 500) print FILENAME ": " NR " lines" }' {} \;)
          if [ -n "$long" ]; then echo "$long"; exit 1; fi
