[package]
name = "sidescreen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
description = "Use an Android tablet as a second display for Windows and Linux over USB or Wi-Fi"
repository = "https://github.com/blackb1rd/sidescreen-desktop"

[dependencies]
aes-gcm = "0.11"
crossbeam-channel = "0.5"
env_logger = "0.11"
hkdf = "0.13"
log = "0.4"
mdns-sd = "0.21"
rand = "0.10"
rusb = "0.9"
sha2 = "0.11"
openh264 = { version = "0.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# A moving test pattern with a software encoder instead of the desktop: for trying the
# protocol, USB and Wi-Fi links on any OS (including macOS) without a capture backend.
test-pattern = ["dep:openh264"]

[profile.release]
lto = true
codegen-units = 1
